services:
  - type: web
    name: tmnt-card-wars
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DB_PATH
        value: /var/data/game.db

      - key: BOT_TOKEN
        sync: false

    disk:
      name: tmnt-game-data
      mountPath: /var/data
      sizeGB: 1
